name: ML Pipeline CI/CD

on: 
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      REGION: ${{ secrets.GCP_REGION }}
      ARTIFACT_REPO: ${{ secrets.GCP_ARTIFACT_REPO }}
      COMPOSER_ENV: ${{ secrets.GCP_COMPOSER_ENV }}
      COMPOSER_BUCKET: ${{ secrets.GCP_COMPOSER_BUCKET }}
      VERTEX_ENDPOINT_ID: ${{ secrets.GCP_VERTEX_ENDPOINT_ID }}
      ENV: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      - name: Verify Service Account
        run: |
          gcloud auth list
      - name: Configure Docker to use Google Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and Push Training Image
        run: |
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/training:${{ github.sha }} \
                       -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/training:latest \
                       -f Dockerfile.train .
          docker push --all-tags ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/training

      - name: Build and Push Inference Image
        run: |
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/inference:${{ github.sha }} \
                       -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/inference:latest \
                       -f Dockerfile.inference .
          docker push --all-tags ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/inference
      - name: Deploy Model to Vertex AI Endpoint
        run: |
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/inference:${{ github.sha }}"
          
          # Upload model with ENV variable
          MODEL_RESOURCE=$(gcloud ai models upload \
            --region=${{ env.REGION }} \
            --display-name=inference-model-${{ github.sha }} \
            --container-image-uri=$IMAGE_URI \
            --container-predict-route=/predict \
            --container-health-route=/health \
            --container-env-vars=ENV=${{ env.ENV }} \
            --format="value(model)")
          
          MODEL_ID=$(echo $MODEL_RESOURCE | awk -F'/' '{print $NF}')
          
          gcloud ai endpoints deploy-model ${{ env.VERTEX_ENDPOINT_ID }} \
            --region=${{ env.REGION }} \
            --model=$MODEL_ID \
            --display-name=deployment-${{ github.sha }} \
            --machine-type=n1-standard-4 \
            --min-replica-count=1 \
            --max-replica-count=3 \
            --traffic-split=0=100

      - name: Set Composer Environment Variables
        continue-on-error: true
        run: |
          gcloud composer environments update ${{ env.COMPOSER_ENV }} \
            --location ${{ env.REGION }} \
            --update-env-variables ML_PROJECT_ID=${{ env.PROJECT_ID }},ML_REGION=${{ env.REGION }},ML_ARTIFACT_REPO=${{ env.ARTIFACT_REPO }},ENV=${{ env.ENV }}

      - name: Copy DAGs to Cloud Composer
        run: |
          gcloud storage cp airflow/dags/*.py gs://${{ env.COMPOSER_BUCKET }}/dags/